<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-style="c" data-accent="brass" data-font="paperlogy">
  <head>
    <meta charset="UTF-8" />
    <!-- [2026-11-01] 확대 막기(maximum-scale) 제거: 안드로이드·PC에서 손가락 확대가 되게. 아이폰은 이 값이 있어도 손가락 확대가 되고,
         없으면 16px보다 작은 입력 칸을 누를 때 화면이 자동 확대돼 세트 입력이 불편해서 아이폰에만 다시 붙인다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0')
      }
    </script>
    <!-- [2026-11-01] 첫 화면(로그인·인트로)의 다크 바탕색. 로그인 뒤에는 App이 현재 테마 바탕색으로 바꾼다 -->
    <meta name="theme-color" content="#141210" />
    <meta name="description" content="BodyTailor Log - 개인 운동 기록 & 점진적 과부하 추적" />
    <!-- [2026-10-30] 카카오톡 등 인앱 브라우저 → 기본 브라우저로(구글 로그인·홈 화면 추가는 기본 브라우저에서만 됨) -->
    <script src="/inapp.js"></script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyTailor" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <!-- [2026-10-28] 디자인 스타일 C 고정 → 숫자 서체 Outfit만 로드(Barlow Condensed·IBM Plex Mono 삭제) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" />
    <title>BodyTailor Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
