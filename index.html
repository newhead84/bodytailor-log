<!DOCTYPE html>
<html lang="ko" data-theme="dark" data-style="c" data-accent="brass" data-font="paperlogy">
  <head>
    <meta charset="UTF-8" />
    <!-- [2026-11-09] 앱 화면 확대·축소 막기(사용자 요청: 기록 중 손가락이 미끄러져 화면이 확대됨). 11-01에 접근성 때문에 풀었던 것을 되돌림.
         안드로이드·PC 크롬은 viewport 값으로, 아이폰은 viewport 값을 무시하므로 아래 스크립트(gesturestart·두 손가락 이동)로 막는다.
         두 번 탭 확대는 tokens.css의 touch-action: manipulation. 소개(/intro/)·처리방침(/privacy/)은 별도 파일이라 확대 그대로. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <script>
      ;(function () {
        var stop = function (e) { e.preventDefault() }
        document.addEventListener('gesturestart', stop, { passive: false })
        document.addEventListener('gesturechange', stop, { passive: false })
        document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault() }, { passive: false })
      })()
    </script>
    <!-- [2026-11-01] 첫 화면(로그인·인트로)의 다크 바탕색. 로그인 뒤에는 App이 현재 테마 바탕색으로 바꾼다 -->
    <meta name="theme-color" content="#141210" />
    <meta name="description" content="BodyTailor Log - 개인 운동 기록 & 점진적 과부하 추적" />
    <!-- [2026-10-30] 카카오톡 등 인앱 브라우저 → 기본 브라우저로(구글 로그인·홈 화면 추가는 기본 브라우저에서만 됨) -->
    <script src="/inapp.js"></script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyTailor" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <!-- [2026-10-28] 디자인 스타일 C 고정 → 숫자 서체 Outfit만 로드(Barlow Condensed·IBM Plex Mono 삭제) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" />
    <title>BodyTailor Log</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
