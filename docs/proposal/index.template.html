<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodyTailor Log 도입 검토 제안서 · 바디테일러 PT&amp;헬스</title><!-- 본문은 build_html.cjs가 content.json으로 만든다 -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" />
<style>
/*FONTS*/
/* 홍보 페이지(/intro)와 같은 토큰: 다크·베이지 교차, 볼트 라임, 페이퍼로지 + Outfit 숫자 */
.dark{--bg:#141210;--card:#1e1b18;--line:#2c2824;--t1:#f5efe6;--t2:#cfc6b8;--t3:#a39b8f;--acc:#c8f53c;--fill:#c8f53c;--onfill:#11170a}
.beige{--bg:#f4ece1;--card:#fff9f1;--line:#e3d3bb;--t1:#2a2118;--t2:#5c5347;--t3:#6b6156;--acc:#4c6600;--fill:#c8f53c;--onfill:#11170a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Paperlogy',system-ui,sans-serif;background:#141210;color:#f5efe6;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.num{font-family:'Outfit','Paperlogy',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
section{padding:100px 0;background:var(--bg);color:var(--t1)}
.label{font:700 13px 'Outfit','Paperlogy',sans-serif;letter-spacing:.06em;color:var(--acc)}
h2{font-weight:800;font-size:clamp(28px,4.4vw,48px);line-height:1.22;letter-spacing:-.025em;margin-top:14px}
.lead{font-size:clamp(16px,1.7vw,19px);line-height:1.75;color:var(--t2);margin-top:18px;max-width:640px}
mark{background:linear-gradient(transparent 62%,var(--fill) 62%);color:inherit}

/* 표지 */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#f5efe6;overflow:hidden;padding:0;background:#141210}
.hero .bg{position:absolute;inset:0;background:url(img/photo-hero.webp) center/cover no-repeat}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,16,.3) 0%,rgba(20,18,16,.4) 40%,rgba(20,18,16,.94) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:clamp(56px,10vh,110px)}
.hero .label{color:#c8f53c}
.hero h1{font-weight:800;font-size:clamp(42px,7.6vw,92px);line-height:1.08;letter-spacing:-.03em;margin-top:16px}
.hero h1 span{color:#c8f53c}
.hero p{font-size:clamp(16px,1.8vw,20px);line-height:1.7;color:#e6dfd4;margin-top:22px;max-width:600px}
.hero .meta{font-size:14px;color:#cfc6b8;margin-top:26px}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}
.toc a{font:700 14px 'Paperlogy',sans-serif;color:#f5efe6;text-decoration:none;padding:9px 14px;border-radius:999px;border:1px solid rgba(245,239,230,.4)}

/* 요약 */
.sum{display:grid;grid-template-columns:1fr auto;gap:56px;align-items:center;margin-top:48px}
.rows3{display:flex;flex-direction:column}
.rows3 .r{display:grid;grid-template-columns:80px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.rows3 .r:first-child{border-top:2px solid var(--t1)}
.rows3 .n{font:800 42px/1 'Outfit',sans-serif;color:var(--acc);letter-spacing:-.04em}
.rows3 h3{font-size:20px;font-weight:800}
.rows3 p{font-size:16px;color:var(--t2);line-height:1.7;margin-top:6px}

/* 휴대폰 */
.phone{position:relative;width:min(260px,66vw);aspect-ratio:390/844;border-radius:40px;padding:9px;background:#0d0c0b;box-shadow:0 24px 50px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.07) inset;flex-shrink:0}
.phone .screen{width:100%;height:100%;border-radius:31px;overflow:hidden;background:#f4ece1}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}

/* 비교 표 */
.compare{margin-top:44px;border-top:2px solid var(--t1)}
.compare .r{display:grid;grid-template-columns:180px 1fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.compare .q{font-size:15px;color:var(--t3);font-weight:600}
.compare .u{font-size:clamp(16px,1.9vw,20px);font-weight:600;line-height:1.55}
.compare .u.big{font-size:clamp(20px,2.4vw,26px);font-weight:800}
.note{margin-top:28px;padding:20px 24px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.7;color:var(--t2)}
.note b{color:var(--acc)}

/* 사진 띠 */
.band{position:relative;min-height:72vh;display:flex;align-items:center;color:#f5efe6;padding:90px 0;overflow:hidden;background:#141210}
.band .bg{position:absolute;inset:0;background:center/cover no-repeat}
.band::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,16,.9) 0%,rgba(20,18,16,.6) 55%,rgba(20,18,16,.25) 100%)}
.band .wrap{position:relative;z-index:2;width:100%}
.band .label{color:#c8f53c}
.band h2{max-width:720px}
.band .lead{color:#e6dfd4}
.band .goal{margin-top:28px;font-size:17px;line-height:1.7;max-width:620px}
.band .goal b{color:#c8f53c}

/* 2x2 방향 */
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:44px}
.grid4 .c{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px}
.grid4 .n{font:800 40px/1 'Outfit',sans-serif;color:var(--acc);letter-spacing:-.04em}
.grid4 h3{font-size:21px;font-weight:800;margin-top:14px}
.grid4 p{font-size:15.5px;color:var(--t2);line-height:1.7;margin-top:8px}

/* 기능 */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:52px}
.feats figure{display:flex;flex-direction:column;align-items:center;text-align:center}
.feats .phone{width:100%;max-width:220px}
.feats figcaption{margin-top:18px}
.feats b{display:block;font-size:18px;font-weight:800}
.feats span{display:block;font-size:14.5px;color:var(--t2);line-height:1.6;margin-top:6px}
.duo{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;margin-top:52px}
.duo .phones{display:flex;gap:18px}
.duo .phones .phone{width:min(220px,40vw)}
.duo h3{font-size:22px;font-weight:800;margin-top:26px}
.duo h3:first-child{margin-top:0}
.duo ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:9px}
.duo li{font-size:16px;padding-left:20px;position:relative;color:var(--t2);line-height:1.6}
.duo li::before{content:'';position:absolute;left:0;top:11px;width:10px;height:3px;background:var(--fill);border-radius:2px}

/* 역할 나눔 */
.role{position:relative;color:#f5efe6;overflow:hidden;background:#141210}
.role .bg{position:absolute;inset:0;background:url(img/photo-trainer.webp) right center/cover no-repeat}
.role::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,13,12,.95) 0%,rgba(14,13,12,.88) 50%,rgba(14,13,12,.45) 100%)}
.role .wrap{position:relative;z-index:2}
.role .label{color:#c8f53c}
.split{margin-top:40px;max-width:640px;border-top:2px solid #f5efe6}
.split .r{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:18px 0;border-bottom:1px solid rgba(245,239,230,.15);font-size:17px}
.split .r b{font-weight:800;color:#cfc6b8}
.split .r b.app{color:#c8f53c}
.role .lead{color:#cfc6b8}

/* 시범 타임라인 */
.tl{display:grid;grid-template-columns:1fr 96px 1fr 96px 1fr;align-items:stretch;margin-top:48px}
.tl .ph{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 24px 26px}
.tl .ph.main{background:var(--fill);border-color:var(--acc);color:var(--onfill)}
.tl .ph h3{font-size:24px;font-weight:800}
.tl .ph .s{font-size:14px;font-weight:600;color:var(--t2);margin-top:4px}
.tl .ph.main .s{color:#2c3410}
.tl .ph ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line);padding-top:16px}
.tl .ph.main ul{border-color:rgba(17,23,10,.2)}
.tl .ph li{font-size:15.5px;line-height:1.5}
.tl .gate{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.tl .gate i{width:16px;height:16px;background:var(--acc);transform:rotate(45deg);display:block}
.tl .gate small{font-size:12px;font-weight:700;color:var(--t2);width:90px;line-height:1.35}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:56px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px}
.box h3{font-size:19px;font-weight:800}
.box ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.box li{font-size:15.5px;color:var(--t2);line-height:1.6;padding-left:20px;position:relative}
.box li::before{content:'';position:absolute;left:0;top:10px;width:10px;height:3px;background:var(--fill);border-radius:2px}
.metrics .m{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.metrics .m:first-of-type{border-top:0}
.metrics .m .k{font:800 22px/1.2 'Outfit',sans-serif;color:var(--acc)}
.metrics .m b{display:block;font-size:16px;font-weight:800}
.metrics .m span{display:block;font-size:14px;color:var(--t2);margin-top:2px}
.metrics .foot{font-size:13px;color:var(--t3);margin-top:12px}

/* 운영 방안 */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.opts .o{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px}
.opts .k{font:800 46px/1 'Outfit',sans-serif;color:var(--acc)}
.opts h3{font-size:20px;font-weight:800;margin-top:14px}
.opts .d{font-size:15.5px;line-height:1.6;margin-top:8px}
.opts .c{font-size:14.5px;font-weight:800;color:var(--acc);margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.opts .x{font-size:14px;color:var(--t2);line-height:1.6;margin-top:6px}
.after{font-size:15px;color:var(--t3);margin-top:22px}

/* 개인정보 */
.pv{margin-top:40px;max-width:760px}
.pv .r{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:20px 0;border-top:1px solid rgba(245,239,230,.15)}
.pv .r b{font-size:17px;font-weight:800;color:#c8f53c}
.pv .r p{font-size:16px;line-height:1.7;color:#e6dfd4}

/* 요청 */
.closing{background:#141210;color:#f5efe6;position:relative;overflow:hidden}
.reqs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:44px}
.reqs label{display:flex;gap:16px;background:#1e1b18;border:1px solid #2c2824;border-radius:20px;padding:22px 24px;cursor:pointer}
.reqs input{appearance:none;width:24px;height:24px;border:2px solid #c8f53c;border-radius:7px;flex-shrink:0;margin-top:2px;cursor:pointer;display:grid;place-items:center}
.reqs input:checked{background:#c8f53c}
.reqs input:checked::after{content:'';width:6px;height:11px;border:solid #11170a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.reqs b{display:block;font-size:18px;font-weight:800}
.reqs span{display:block;font-size:15px;color:#cfc6b8;line-height:1.6;margin-top:4px}
.closing .final{margin-top:36px;font-size:18px;line-height:1.7;max-width:760px}
.closing .final b{color:#c8f53c}
footer{background:#141210;color:#a39b8f;font-size:13px;padding:28px 0 40px;border-top:1px solid #2c2824}

@media (max-width:820px){
  section{padding:76px 0}
  .sum,.duo{grid-template-columns:1fr;gap:36px}
  .sum .phone{margin:0 auto}
  .grid4,.cols2,.reqs,.opts{grid-template-columns:1fr}
  .feats{grid-template-columns:1fr 1fr;gap:30px 18px}
  .compare .r,.pv .r{grid-template-columns:1fr;gap:6px}
  .tl{grid-template-columns:1fr}
  .tl .gate{flex-direction:row;padding:14px 0}
  .tl .gate small{width:auto}
  .duo .phones{justify-content:center}
  .duo .phones .phone{width:min(170px,42vw)}
  .rows3 .r{grid-template-columns:56px 1fr}
  .rows3 .n{font-size:34px}
}

/* v2: 표지(제안서 표시) */
.hero .tag{display:inline-block;font:800 15px 'Paperlogy',sans-serif;background:#c8f53c;color:#11170a;padding:9px 16px;border-radius:999px}
.hero .to{font-size:15px;font-weight:600;color:#e6dfd4;margin-top:22px}
.hero h1{font-size:clamp(38px,6.4vw,80px)}
.hero .subt{font-size:clamp(20px,2.6vw,30px);font-weight:600;color:#c8f53c;margin-top:16px}
.hero .meta{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;margin-top:28px;padding-top:22px;border-top:1px solid rgba(245,239,230,.35);max-width:720px}
.hero .meta dt{font-size:14px;font-weight:600;color:#c8f53c}
.hero .meta dd{font-size:15px;color:#f5efe6}
/* 요약 */
.sum2{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;margin-top:44px;align-items:start}
.diffs{display:flex;flex-direction:column;gap:16px}
.diffs .d{border-radius:22px;padding:26px 28px}
.diffs .d b{display:block;font-size:15px;font-weight:800}
.diffs .d p{font-size:17px;line-height:1.65;margin-top:10px}
.diffs .lime{background:#c8f53c;color:#11170a}
.diffs .ink{background:#141210;color:#f5efe6}
.diffs .ink b{color:#c8f53c}
/* 문제 */
.probs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;max-width:900px}
.probs div{background:rgba(30,27,24,.82);border:1px solid #3a342e;border-radius:20px;padding:24px 26px}
.probs b{font-size:18px;font-weight:800;color:#c8f53c}
.probs p{font-size:16px;line-height:1.7;color:#e6dfd4;margin-top:10px}
.feats{margin-top:40px}
/* PT 회원 흐름 */
.flow{list-style:none;display:flex;flex-direction:column}
.flow li{display:grid;grid-template-columns:44px 1fr;gap:16px;position:relative;padding-bottom:26px}
.flow li:not(:last-child)::before{content:'';position:absolute;left:21px;top:46px;bottom:4px;width:2px;background:var(--line)}
.flow i{width:44px;height:44px;border-radius:50%;background:#141210;color:#c8f53c;display:grid;place-items:center;font:800 18px 'Outfit',sans-serif;font-style:normal}
.flow li.on i{background:#c8f53c;color:#11170a}
.flow b{display:block;font-size:19px;font-weight:800;margin-top:4px}
.flow span{display:block;font-size:15.5px;color:var(--t2);line-height:1.6;margin-top:4px}
/* 왜 트레이너 먼저 */
.why3{display:flex;flex-direction:column;gap:22px;margin-top:36px;max-width:620px}
.why3 div{display:grid;grid-template-columns:56px 1fr;column-gap:12px}
.why3 .k{font:800 28px/1 'Outfit',sans-serif;color:#c8f53c;grid-row:span 2}
.why3 b{font-size:19px;font-weight:800}
.why3 p{font-size:15.5px;color:#cfc6b8;line-height:1.65;margin-top:6px}
/* 타임라인 v2 */
.tl .ph .top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--acc)}
.tl .ph.main .top{color:#2c3410}
.tl .ph h3{margin-top:8px}
.tl .gate small b{font-size:13px;color:var(--t1)}
.cols2+.cols2{margin-top:22px}
.mini{font:700 12px 'Outfit','Paperlogy',sans-serif;letter-spacing:.04em;color:var(--acc);margin-bottom:8px}
.box .mini+h3{margin-top:0}
.metrics .mini{margin-bottom:6px}
/* 개인정보·요청 */
.pvsec .pv .r{border-color:var(--line)}
.pvsec .pv .r b{color:var(--acc)}
.pvsec .pv .r p{color:var(--t2)}
.closing .bg{position:absolute;inset:0;background:url(img/photo-hero.webp) center/cover no-repeat;opacity:.28}
.closing .wrap{position:relative;z-index:2}
.reqg{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;margin-top:40px}
.reqg .gh{font-size:15px;font-weight:800;color:#c8f53c;margin-bottom:12px}
.reqs1{display:flex;flex-direction:column;gap:12px}
.reqs1 label{display:flex;gap:16px;background:rgba(30,27,24,.9);border:1px solid #2c2824;border-radius:18px;padding:18px 22px;cursor:pointer}
.reqs1 input{appearance:none;width:24px;height:24px;border:2px solid #c8f53c;border-radius:7px;flex-shrink:0;margin-top:2px;cursor:pointer;display:grid;place-items:center}
.reqs1 input:checked{background:#c8f53c}
.reqs1 input:checked::after{content:'';width:6px;height:11px;border:solid #11170a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.reqs1 b{display:block;font-size:17px;font-weight:800}
.reqs1 span{display:block;font-size:14.5px;color:#cfc6b8;margin-top:4px}
@media (max-width:820px){
  .sum2,.probs,.reqg{grid-template-columns:1fr}
  .hero .meta{grid-template-columns:84px 1fr}
}
/* v3: 요약 세 번째 카드, 브릿지 장, 홈페이지 주소 */
.diffs .line{background:var(--card);border:1px solid var(--line)}
.diffs .line b{color:var(--acc)}
.grid4.bridge .c.on{background:var(--fill);border-color:var(--acc);color:var(--onfill)}
.grid4.bridge .c.on .n,.grid4.bridge .c.on p{color:var(--onfill)}
.compare .u.url{color:var(--acc);word-break:break-all}
/* 진행 단계 아래 STEP 1·2 소제목 */
.sub{margin-top:64px}
.sub .mini{margin-bottom:6px}
.subh{font-size:clamp(20px,2.4vw,26px);font-weight:800;line-height:1.35}
.sub+.cols2{margin-top:20px}
.box.metrics h3{margin-bottom:6px}
/* 문구 편집 도구(인쇄·발표 때 숨김) */
#edit-kit{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;gap:8px;font:700 14px 'Paperlogy',sans-serif}
#edit-kit button{font:inherit;padding:11px 16px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#ek-toggle{background:#c8f53c;color:#11170a}
#ek-copy{background:#141210;color:#f5efe6;border:1px solid #c8f53c}
[data-editing] [data-kind=text]{outline:1px dashed currentColor;outline-offset:3px;cursor:text}
[data-kind=text].ek-changed{background:rgba(200,245,60,.25)}
@media print{#edit-kit{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
